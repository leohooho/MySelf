# 基于 Repcz Egern 配置精简定制
# 原配置: https://github.com/Repcz/Tool/blob/X/Egern/Egern.yaml
# 参考: https://github.com/Centralmatrix3/Matrix-io/blob/master/Config/Egern/Matrix.yaml
# 最后更新时间: 2026-08-20
#
# Egern Version ≥ v2.20.0(772)
# 官方文档: https://doc.egernapp.com
#
# 以 ';' 或 '#' 或 '//' 开头的配置文件行为注释行
#
# 本地定制：
#   · Proxy：主代理及订阅入口
#   · AI：AI 服务独立选路
#   · HongKong：优先选择香港节点，不可用时回退直连
#   · DNS：统一使用腾讯与阿里加密 DNS
#   · 使用前请将 Proxy.urls 替换为自己的订阅地址
vif_only: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
proxy_latency_test_url: https://cp.cloudflare.com/generate_204

dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    EncryptedDNS:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  forward:
  - domain_wildcard:
      match: '*'
      value: EncryptedDNS
      disabled: false
  public_ip_lookup_url: https://ifconfig.me/ip

policy_groups:
- select:
    name: Proxy
    urls:
    - http://your-service-provider
    hidden: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
- select:
    name: AI
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png
- auto_test:
    name: HongKong-Auto
    policies:
    - Proxy
    flatten: true
    filter: (?i)🇭🇰|香港|港|Hong\s*Kong|HongKong|HKBN|HGC|HKIX|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    hidden: true
- fallback:
    name: HongKong
    policies:
    - HongKong-Auto
    - DIRECT
    flatten: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    hidden: true
rules:
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Reject.yaml
    policy: REJECT
- rule_set:
    match: https://raw.githubusercontent.com/leohooho/MySelf/main/Egern/Rule/Hsbc.yaml
    policy: HongKong
- rule_set:
    match: https://raw.githubusercontent.com/leohooho/MySelf/main/Egern/Rule/IBKR.yaml
    policy: HongKong
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Direct.yaml
    policy: DIRECT
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/AI.yaml
    policy: AI
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Proxy.yaml
    policy: Proxy
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Lan.yaml
    policy: DIRECT
- geoip:
    match: CN
    policy: DIRECT
- default:
    policy: Proxy
mitm:
  enabled: true

modules:
- url: https://raw.githubusercontent.com/Maasea/sgmodule/master/YouTube.Enhance.sgmodule
  enabled: true

- url: https://raw.githubusercontent.com/kokoryh/Sparkle/refs/heads/master/release/surge/module/bilibili.sgmodule
  enabled: true

- name: WeatherKit
  url: https://github.com/NSRingo/WeatherKit/releases/latest/download/iRingo.WeatherKit.sgmodule
  enabled: true
  update_interval: 259200

- name: 综合电商去广告
  url: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Module/EcommerceAdBlock.yaml
  enabled: true
  update_interval: 86400

- name: 京东比价
  url: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Module/JDPrice.yaml
  enabled: false
  update_interval: 86400

- name: App开屏广告跳过
  url: https://yfamilys.com/module/adultraplus.sgmodule
  enabled: true
  update_interval: 86400

- name: 小组件
  url: https://raw.githubusercontent.com/egerndaddy/quick-start/refs/heads/main/modules/widgets.yaml
  enabled: true
  update_interval: 86400
- name: Egern 桌面小组件合集
  url: https://raw.githubusercontent.com/jnlaoshu/MySelf/refs/heads/main/Egern/Widget/Widgets.yaml
  enabled: true
  update_interval: 43200
